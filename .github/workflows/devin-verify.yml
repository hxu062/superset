name: devin-verify

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devin-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      SUPERSET_TESTENV: true
      SUPERSET_SECRET_KEY: not-a-secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup backend
        uses: ./.github/actions/setup-backend/
        with:
          python-version: current

      - name: Changed Python files
        id: changed
        if: github.event_name == 'pull_request'
        run: |
          FILES=$(git diff --name-only origin/master...HEAD -- '*.py' | tr '\n' ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "Changed: ${FILES:-none}"

      - name: Lint changed files
        if: steps.changed.outputs.files != ''
        run: ruff check ${{ steps.changed.outputs.files }}

      - name: Type-check changed files
        if: steps.changed.outputs.files != ''
        continue-on-error: true
        run: mypy ${{ steps.changed.outputs.files }}

      - name: Unit tests
        run: pytest ./tests/common ./tests/unit_tests -q --no-header --maxfail=10